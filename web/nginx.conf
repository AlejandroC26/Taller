# Mismo origen que en desarrollo: la web pide /api y /mcp y nginx los pasa a la API.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 6m; # evidencias de hasta 5 MB

  location /api/ { proxy_pass http://api:3417; proxy_set_header Host $host; proxy_read_timeout 120s; }
  location /mcp  { proxy_pass http://api:3417; proxy_set_header Host $host; proxy_read_timeout 120s; proxy_buffering off; }

  # React Router: cualquier otra ruta es la aplicación.
  location / { try_files $uri /index.html; }
}
